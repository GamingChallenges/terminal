<!DOCTYPE html>
<html>
<head>
  <title>Lazarus Node-02</title>

  <style>
    body {
      background: black;
      color: #00ff9f;
      font-family: monospace;
      margin: 0;
    }

    #terminal {
      padding: 30px;
      height: 100vh;
      overflow-y: auto;
      white-space: pre-line;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff9f;
    }

    .glitch {
      animation: glitch 0.08s infinite;
      color: red;
    }

    @keyframes glitch {
      0% { transform: translate(2px, -2px); }
      50% { transform: translate(-2px, 2px); }
      100% { transform: translate(0); }
    }

    .flicker {
      animation: flicker 0.15s;
    }

    @keyframes flicker {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
  </style>
</head>

<body>

<div id="terminal"></div>

<script>
const term = document.getElementById("terminal");

function scroll() {
  term.scrollTop = term.scrollHeight;
}

// 🔥 Random flicker
function randomFlicker() {
  if (Math.random() < 0.15) {
    term.classList.add("flicker");
    setTimeout(() => term.classList.remove("flicker"), 100);
  }
}

// 😈 Glitch text injection
async function glitchText(text) {
  term.classList.add("glitch");
  term.innerHTML += text + "\n";
  scroll();
  await new Promise(r => setTimeout(r, 200));
  term.classList.remove("glitch");
}

// typing with random glitches
function typeText(text, speed = 25) {
  return new Promise(resolve => {
    let i = 0;
    let interval = setInterval(async () => {

      // random flicker effect
      randomFlicker();

      // random glitch moment
      if (Math.random() < 0.05) {
        clearInterval(interval);
        await glitchText("/// SIGNAL ERROR ///");
        interval = setInterval(type, speed);
        return;
      }

      type();

      function type() {
        term.innerHTML += text[i];
        i++;
        scroll();

        if (i >= text.length) {
          clearInterval(interval);
          term.innerHTML += "\n";
          resolve();
        }
      }

    }, speed);
  });
}

async function boot() {

  await typeText(">>> CONNECTING TO NODE-02...");
  await typeText(">>> CONNECTION UNSTABLE");
  await typeText(">>> DATA CORRUPTION DETECTED\n");

  await glitchText("!! MEMORY FAULT DETECTED !!");

  await typeText("RECOVERING FILES...");
  await typeText("RECOVERY PARTIAL\n");

  await typeText("[LOG ENTRY — FINAL TRANSMISSION]");
  await typeText("");

  await typeText("If you're seeing this... Lazarus has already lost control.");
  await typeText("This was never just an outbreak.");
  await typeText("The infection is adapting faster than we can contain it.");
  await typeText("");

  await glitchText("/// UNKNOWN PROCESS DETECTED ///");

  await typeText("Subject-07 is no longer a test.");
  await typeText("It is leading them.");
  await typeText("Coordinating them.");
  await typeText("");

  await typeText("We called it evolution.");
  await typeText("We were wrong.");
  await typeText("");

  await typeText("It's intelligence.");
  await typeText("");

  await glitchText(">> ACCESSING EXTERNAL SIGNAL <<");

  await typeText("It knows where we are.");
  await typeText("It knows where YOU are.");
  await typeText("");

  await typeText("The last stronghold is compromised.");
  await typeText("They are gathering.");
  await typeText("");

  await typeText("If there is any chance left...");
  await typeText("You need to go to the distribution site.");
  await typeText("");

  await typeText("Coordinates recovered:");
  await typeText("X: 124  Y: 64  Z: -392");
  await typeText("");

  await typeText("That’s where it started spreading faster.");
  await typeText("That’s where it’s strongest.");
  await typeText("");

  await glitchText("///// THEY SEE YOU /////");

  await typeText("That’s where it’s waiting.");
  await typeText("");

  await typeText("— Dr. Halden");

  await typeText("");
  await typeText("...something else is in this system");

  await glitchText(">> CONNECTION NOT CLOSED <<");
}

boot();
</script>

</body>
</html>
