<!DOCTYPE html>
<html>
<head>
  <title>Lazarus Node-02</title>

  <style>
    body {
      background: black;
      color: #00ff9f;
      font-family: monospace;
      margin: 0;
    }

    #terminal {
      padding: 30px;
      height: 100vh;
      overflow-y: auto;
      white-space: pre-line;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff9f;
    }

    .glitch {
      animation: glitch 0.1s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(2px, -2px); color: red; }
      50% { transform: translate(-2px, 2px); }
      100% { transform: translate(0); color: #00ff9f; }
    }
  </style>
</head>

<body>

<div id="terminal"></div>

<script>
const term = document.getElementById("terminal");

function typeText(text, speed = 25) {
  return new Promise(resolve => {
    let i = 0;
    let interval = setInterval(() => {
      term.innerHTML += text[i];
      i++;
      term.scrollTop = term.scrollHeight;

      if (i >= text.length) {
        clearInterval(interval);
        term.innerHTML += "\n";
        resolve();
      }
    }, speed);
  });
}

async function boot() {

  await typeText(">>> CONNECTING TO NODE-02...");
  await typeText(">>> CONNECTION UNSTABLE");
  await typeText(">>> DATA CORRUPTION DETECTED\n");

  term.classList.add("glitch");

  await typeText("RECOVERING FILES...");
  await typeText("RECOVERY PARTIAL\n");

  term.classList.remove("glitch");

  await typeText("[LOG ENTRY — FINAL TRANSMISSION]");
  await typeText("");

  await typeText("If you're seeing this... Lazarus has already lost control.");
  await typeText("This was never just an outbreak.");
  await typeText("The infection is adapting faster than we can contain it.");
  await typeText("");

  await typeText("Subject-07 is no longer a test.");
  await typeText("It is leading them.");
  await typeText("Coordinating them.");
  await typeText("");

  await typeText("We called it evolution.");
  await typeText("We were wrong.");
  await typeText("");

  await typeText("It's intelligence.");
  await typeText("");

  await typeText("It knows where we are.");
  await typeText("It knows where YOU are.");
  await typeText("");

  await typeText("The last stronghold is compromised.");
  await typeText("They are gathering.");
  await typeText("");

  await typeText("If there is any chance left...");
  await typeText("You need to go to the distribution site.");
  await typeText("");

  await typeText("Coordinates recovered:");
  await typeText("X: 124  Y: 64  Z: -392");
  await typeText("");

  await typeText("That’s where it started spreading faster.");
  await typeText("That’s where it’s strongest.");
  await typeText("");

  await typeText("That’s where it’s waiting.");
  await typeText("");

  await typeText("— Dr. Halden");

  await typeText("");
  await typeText("...something else is in this system");
}

boot();
</script>

</body>
</html>
