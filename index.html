<!DOCTYPE html>
<html>
<head>
  <title>Secure Terminal</title>

  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      margin: 0;
      overflow: hidden;
    }

    #terminal {
      padding: 20px;
      height: 100vh;
      white-space: pre-line;
    }

    input {
      background: transparent;
      color: #00ff00;
      border: none;
      outline: none;
      font-family: monospace;
      width: 100%;
    }

    .glitch {
      animation: glitch 0.2s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(2px, -2px); color: red; }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, 2px); }
      75% { transform: translate(-2px, -2px); }
      100% { transform: translate(0); color: #00ff00; }
    }
  </style>
</head>

<body>

<div id="terminal">
Initializing system...
Connecting to remote node...
Bypassing firewall...

ENTER PASSWORD:
</div>

<input id="input" autofocus onkeydown="handle(event)">

<audio id="typeSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
const term = document.getElementById("terminal");
const input = document.getElementById("input");
const sound = document.getElementById("typeSound");

function playSound() {
  sound.currentTime = 0;
  sound.play();
}

function randomIP() {
  return Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255);
}

function typeText(text, speed = 20) {
  return new Promise(resolve => {
    let i = 0;
    let interval = setInterval(() => {
      term.innerHTML += text[i];
      playSound();
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        term.innerHTML += "\n";
        resolve();
      }
    }, speed);
  });
}

async function handle(e) {
  if (e.key === "Enter") {
    let val = input.value.toLowerCase();
    input.value = "";

    term.innerHTML += "> " + val + "\n";

    if (val === "ikea") {

      await typeText("ACCESS GRANTED...");
      await typeText("Decrypting data...");
      await typeText("Target: IKEA FACILITY");
      await typeText("HORDE INBOUND");

    } else {

      // GLITCH EFFECT
      term.classList.add("glitch");

      await typeText("ACCESS DENIED");
      await typeText("Tracking user...");
      await typeText("IP: " + randomIP());
      await typeText("Location found.");
      await typeText("Do not try again.");

      setTimeout(() => {
        term.classList.remove("glitch");
      }, 1000);
    }
  }
}
</script>

</body>
</html>
