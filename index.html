<!DOCTYPE html>
<html>
<head>
  <title>Secure Terminal</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      padding: 20px;
    }
    #terminal {
      white-space: pre-line;
    }
    input {
      background: black;
      color: #00ff00;
      border: none;
      outline: none;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div id="terminal">
Initializing system...
Connecting...
Accessing database...

ENTER PASSWORD:
</div>

<input id="input" autofocus onkeydown="handle(event)">

<script>
function typeText(text, delay = 30) {
  return new Promise(resolve => {
    let i = 0;
    let term = document.getElementById("terminal");
    let interval = setInterval(() => {
      term.innerHTML += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        term.innerHTML += "\n";
        resolve();
      }
    }, delay);
  });
}

async function handle(e) {
  if (e.key === "Enter") {
    let val = document.getElementById("input").value.toLowerCase();
    document.getElementById("input").value = "";

    let term = document.getElementById("terminal");

    term.innerHTML += "> " + val + "\n";

    if (val === "ikea") {
      await typeText("ACCESS GRANTED...");
      await typeText("Target identified:");
      await typeText("IKEA WAREHOUSE");
      await typeText("Prepare for horde.");
    } else {
      await typeText("ACCESS DENIED");
    }
  }
}
</script>

</body>
</html>
