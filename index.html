<!DOCTYPE html>
<html>
<head>
  <title>Lazarus Biotech Terminal</title>

  <style>
    body {
      background: black;
      color: #00ff9f;
      font-family: monospace;
      margin: 0;
    }

    #terminal {
      padding: 30px;
      height: 100vh;
      overflow-y: auto;
      white-space: pre-line;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff9f;
    }

    .logo {
      text-align: left;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ff9f, 0 0 20px #00ff9f;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      background: #00ff9f;
      animation: blink 1s infinite;
      margin-left: 5px;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .glitch {
      animation: glitch 0.15s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(2px, -2px); color: red; }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, 2px); }
      75% { transform: translate(-2px, -2px); }
      100% { transform: translate(0); color: #00ff9f; }
    }

    /* 🔥 Screen flicker */
    .flicker {
      animation: flicker 0.2s ease-in-out 3;
    }

    @keyframes flicker {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    #hiddenInput {
      position: absolute;
      opacity: 0;
    }
  </style>
</head>

<body>

<div id="terminal"></div>
<input id="hiddenInput" autofocus>

<audio id="typeSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
const term = document.getElementById("terminal");
const input = document.getElementById("hiddenInput");
const sound = document.getElementById("typeSound");

let currentInput = "";

// focus
document.body.addEventListener("click", () => input.focus());

input.addEventListener("keydown", async (e) => {
  if (e.key.length === 1) {
    currentInput += e.key;
    updateLine();
  }

  if (e.key === "Backspace") {
    currentInput = currentInput.slice(0, -1);
    updateLine();
  }

  if (e.key === "Enter") {
    term.innerHTML += "\n";
    await handleCommand(currentInput.toLowerCase());
    currentInput = "";
    createInputLine();
  }
});

function updateLine() {
  const line = document.getElementById("currentLine");
  if (line) {
    line.innerHTML = "Password: " + currentInput + `<span class="cursor"></span>`;
  }
}

function createInputLine() {
  term.innerHTML += `<div id="currentLine">Password: <span class="cursor"></span></div>`;
  scrollToBottom();
}

function scrollToBottom() {
  term.scrollTop = term.scrollHeight;
}

function playSound() {
  sound.currentTime = 0;
  sound.play();
}

function randomIP() {
  return Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255) + "." +
         Math.floor(Math.random()*255);
}

function typeText(text, speed = 20) {
  return new Promise(resolve => {
    let i = 0;
    let interval = setInterval(() => {
      term.innerHTML += text[i];
      playSound();
      i++;
      scrollToBottom();
      if (i >= text.length) {
        clearInterval(interval);
        term.innerHTML += "\n";
        resolve();
      }
    }, speed);
  });
}

// countdown
function getCountdown() {
  const now = new Date();

  const target = new Date();
  target.setDate(target.getDate() + (5 - target.getDay() + 7) % 7);
  target.setHours(22, 0, 0, 0);

  const diff = target - now;

  const hours = Math.floor(diff / 1000 / 60 / 60);
  const minutes = Math.floor((diff / 1000 / 60) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  return `${hours}h ${minutes}m ${seconds}s`;
}

setInterval(() => {
  const el = document.getElementById("countdown");
  if (el) el.innerText = `PROJECT TIMER: ${getCountdown()}`;
}, 1000);

// boot
async function boot() {

  term.classList.add("flicker");

  term.innerHTML += `
<div class="logo">
╔══════════════════════════════╗
║      LAZARUS BIOTECH         ║
║   Internal Secure System     ║
╚══════════════════════════════╝
</div>
`;

  await typeText("Establishing secure uplink...");
  await typeText("Accessing containment network...");
  await typeText("WARNING: INFECTION LEVELS CRITICAL");
  await typeText("WARNING: UNAUTHORIZED ACCESS WILL BE TRACKED");
  await typeText("");

  term.innerHTML += `<span id="countdown">PROJECT TIMER: ${getCountdown()}</span>\n\n`;

  await typeText("User: Dr. Halden");
  createInputLine();
}

async function handleCommand(val) {

  // 🔐 CHANGE THIS PASSWORD WHEN READY
  if (val === "halden") {

    await typeText("ACCESS ACCEPTED");
    await typeText("Verifying credentials...");
    await typeText("Establishing secure session...");
    await typeText("Linking to Lazarus internal network...");
    await typeText("Welcome, Dr. Halden");
    await typeText("");

    await typeText("Redirecting to NODE-02...");

    setTimeout(() => {
      window.location.href = "/node-02";
    }, 2000);
  }

  else {
    term.classList.add("glitch");

    await typeText("ACCESS DENIED");
    await typeText("Tracing connection...");
    await typeText("IP: " + randomIP());
    await typeText("Location locked.");
    await typeText("Lazarus Security notified.");

    setTimeout(() => term.classList.remove("glitch"), 1000);
  }
}
</script>

</body>
</html>
